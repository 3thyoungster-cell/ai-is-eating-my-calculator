<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>琥珀健康飲食試算器 - 衛福部國健署指南延伸版</title>
  <style>
    :root { 
      --ink: #17212b; 
      --muted: #73808c; 
      --paper: #f6f2ea; 
      --panel: #fffdfa; 
      --line: #e8e1d5; 
      --orange: #ec6b31; 
      --orange-dark: #cf5120; 
      --mint: #dff1e9; 
      --mint-ink: #27644f; 
      --card-bg: rgba(255, 253, 250, 0.92);
      --input-bg: #f1eee8;
      --tag-bean: #2e7d32;
      --tag-fish: #0288d1;
      --tag-egg: #ed6c02;
      --tag-meat: #d32f2f;
    }
    
    * { box-sizing: border-box; }
    
    body { 
      margin: 0; 
      min-height: 100vh; 
      display: grid; 
      place-items: center; 
      padding: 28px 16px; 
      color: var(--ink); 
      background: radial-gradient(circle at 16% 12%, #f9d9bf 0 9%, transparent 30%), 
                  radial-gradient(circle at 86% 88%, #cce9da 0 9%, transparent 32%), 
                  var(--paper); 
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; 
    }
    
    .calculator { 
      width: min(100%, 520px); 
      padding: 24px; 
      background: var(--card-bg); 
      border: 1px solid rgba(255, 255, 255, 0.85); 
      border-radius: 28px; 
      box-shadow: 0 24px 60px rgba(81, 61, 37, 0.16); 
      backdrop-filter: blur(12px); 
    }
    
    .top { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 16px; 
    }
    
    .brand { font-size: 14px; letter-spacing: .12em; font-weight: 700; }
    
    .mode { 
      border: 0; 
      border-radius: 999px; 
      padding: 8px 14px; 
      color: var(--mint-ink); 
      background: var(--mint); 
      font: inherit; 
      font-size: 12px; 
      font-weight: 600;
      cursor: pointer; 
      transition: background 0.2s ease;
    }

    .subtitle-banner {
      background: var(--mint);
      color: var(--mint-ink);
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 12px;
      line-height: 1.4;
      margin-bottom: 18px;
      font-weight: 500;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .form-group {
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
    }

    input, select {
      width: 100%;
      min-height: 46px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--input-bg);
      color: var(--ink);
      font: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input:focus, select:focus {
      border-color: var(--orange);
    }

    .submit-btn {
      width: 100%;
      min-height: 52px;
      margin-top: 8px;
      border: 0;
      border-radius: 16px;
      color: #fff;
      background: var(--orange);
      font: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 16px rgba(236, 107, 49, 0.24);
      transition: transform 0.12s ease, background 0.12s ease;
    }

    .submit-btn:hover {
      background: var(--orange-dark);
      transform: translateY(-2px);
    }

    .msg-box {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.5;
      display: none;
    }

    .msg-box.error { display: block; background: #fde8e8; color: #c53030; border: 1px solid #feb2b2; }
    .msg-box.warning { display: block; background: #fffaf0; color: #9c4221; border: 1px solid #fbd38d; }

    /* 國健署專屬營養試算結果螢幕 */
    .recommend-screen {
      margin-top: 20px;
      padding: 18px;
      border-radius: 20px;
      background: var(--ink);
      color: #fff;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.09);
      display: none;
    }

    .recommend-screen.active { display: block; }
    .recommend-title { font-size: 12px; color: #aab5bc; margin-bottom: 6px; letter-spacing: .05em; }
    .recommend-name { font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 6px; }
    .recommend-meta { font-size: 13px; color: var(--mint); margin-bottom: 12px; }
    
    .hpa-info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 12px;
      color: #d0d7de;
    }

    .results-area { margin-top: 20px; display: none; }
    .results-area.active { display: block; }
    .results-title { font-size: 14px; font-weight: 700; margin-bottom: 10px; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; }

    .tag { padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .tag-豆 { background: #e8f5e9; color: var(--tag-bean); }
    .tag-魚 { background: #e1f5fe; color: var(--tag-fish); }
    .tag-蛋 { background: #fff3e0; color: var(--tag-egg); }
    .tag-肉 { background: #ffebee; color: var(--tag-meat); }

    .hint { margin-top: 20px; color: var(--muted); font-size: 12px; text-align: center; line-height: 1.5; }

    .dark { 
      --paper: #17212b; 
      --panel: #202c37; 
      --ink: #eef4f1; 
      --muted: #b0c0ba; 
      --line: #364651; 
      --card-bg: rgba(32, 44, 55, 0.92);
      --input-bg: #2d3b46;
    }

    .dark input, .dark select { color: #eef4f1; }
    .dark .msg-box.error { background: #4a1d1d; color: #feb2b2; border-color: #9b2c2c; }
    .dark .msg-box.warning { background: #4a3319; color: #fbd38d; border-color: #9c4221; }

    @media (max-width: 480px) { 
      .form-row { grid-template-columns: 1fr; }
      .calculator { padding: 18px; } 
    }
  </style>
</head>
<body>
  <main class="calculator" aria-label="琥珀健康飲食試算器">
    <div class="top">
      <span class="brand">AMBER / DIET Guide</span>
      <button class="mode" id="theme" type="button" aria-label="切換深色模式">深色模式</button>
    </div>

    <div class="subtitle-banner">
      🏛️ 依據衛生福利部國民健康署《每日飲食指南》<br>
      原則：豆 > 魚 > 蛋 > 肉｜蛋白質 1 份 ≒ 7 克
    </div>

    <form id="calcForm" onsubmit="event.preventDefault(); calculate();">
      <!-- 國健署個人化身體數據估算 -->
      <div class="form-row">
        <div class="form-group">
          <label for="activity">每日活動強度 (TDEE)</label>
          <select id="activity">
            <option value="1.2">久坐/辦公室族群 (基數 x 1.2)</option>
            <option value="1.375">輕度運動/每週1-3天 (x 1.375)</option>
            <option value="1.55">中度運動/每週3-5天 (x 1.55)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="weight">體重 (kg)</label>
          <input type="number" id="weight" placeholder="例如：60" value="60" min="30" max="200" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="budget">單餐預算上限 (元)</label>
          <input type="number" id="budget" placeholder="例如：100" min="1" required>
        </div>

        <div class="form-group">
          <label for="calories">單餐熱量上限 (kcal)</label>
          <input type="number" id="calories" placeholder="例如：600" min="1" required>
        </div>
      </div>

      <div class="form-group">
        <label for="category">國健署蛋白質優先順序</label>
        <select id="category">
          <option value="ALL">全部類別（顯示所有符合條件）</option>
          <option value="豆">🌿 豆類（首選：植物性蛋白、零膽固醇、高纖）</option>
          <option value="魚">🐟 魚類與海鮮（次選：飽和脂肪低、富含 Omega-3）</option>
          <option value="蛋">🥚 雞蛋（優質完全蛋白質、富含卵磷脂）</option>
          <option value="肉">🥩 肉類（禽肉優先於紅肉、避免加工肉）</option>
        </select>
      </div>

      <button class="submit-btn" type="submit">🔍 開始計算與國健署指南對照</button>
    </form>

    <div id="msgBox" class="msg-box"></div>

    <!-- 國健署營養解析螢幕 -->
    <section id="recommendScreen" class="recommend-screen" aria-live="polite">
      <div class="recommend-title">🎲 試算隨機首選餐點</div>
      <div class="recommend-name" id="recName">-</div>
      <div class="recommend-meta" id="recMeta">-</div>
      
      <div class="hpa-info-grid">
        <div>蛋白質相當於：<br><strong id="recPortion" style="color:#fff; font-size:14px;">-</strong> 份</div>
        <div>佔個人每日蛋白質：<br><strong id="recRatio" style="color:var(--mint); font-size:14px;">-</strong></div>
        <div style="grid-column: span 2; padding-top:4px;" id="recHpaTip">💡 國健署提醒：-</div>
      </div>
    </section>

    <!-- 符合條件列表 -->
    <section id="resultsArea" class="results-area">
      <div class="results-title" id="resultsTitle">📋 符合條件的外食組合</div>
      <table>
        <thead>
          <tr>
            <th>品名</th>
            <th>類別</th>
            <th>價格</th>
            <th>熱量</th>
            <th>蛋白質份數</th>
          </tr>
        </thead>
        <tbody id="resultsTableBody">
        </tbody>
      </table>
    </section>

    <p class="hint">參考資料：衛福部國民健康署《每日飲食指南手冊》<br>三大營養素建議比例：蛋白質 10-20%、脂質 20-30%、醣類 50-60%</p>
  </main>

  <script>
    // 擴充包含國健署指引提示的餐點資料庫
    const FOOD_DATABASE = [
      { name: "高纖無糖豆漿", price: 25, calories: 160, protein: 15, category: "豆", tip: "植物蛋白首選，含大豆異黃酮與膳食纖維" },
      { name: "涼拌毛豆仁", price: 35, calories: 110, protein: 9, category: "豆", tip: "原態豆類，高蛋白且飽和脂肪極低" },
      { name: "滷豆腐", price: 20, calories: 90, protein: 7, category: "豆", tip: "傳統豆製品，易消化且富含植物蛋白" },
      { name: "水煮鮭魚菲力", price: 85, calories: 220, protein: 24, category: "魚", tip: "富含 DHA 與 EPA 好油，優於紅肉脂肪" },
      { name: "鮮魚味噌湯", price: 45, calories: 120, protein: 12, category: "魚", tip: "低脂海鮮來源，注意鹽份適量飲用" },
      { name: "茶葉蛋", price: 13, calories: 75, protein: 7, category: "蛋", tip: "完全蛋白質，蛋黃富含卵磷脂與維生素B群" },
      { name: "石安牧場溫泉蛋", price: 32, calories: 80, protein: 8, category: "蛋", tip: "輕鬆補充優質蛋白質，吸收率高" },
      { name: "即食舒肥雞胸肉", price: 59, calories: 140, protein: 23, category: "肉", tip: "白肉首選，低脂高蛋白，優於豬牛肉" },
      { name: "美式烤雞腿", price: 65, calories: 280, protein: 20, category: "肉", tip: "去除外皮可大幅減少飽和脂肪攝取" },
      { name: "經典牛丼便當", price: 95, calories: 650, protein: 25, category: "肉", tip: "紅肉飽和脂肪較高，國健署建議偶爾食用即可" }
    ];

    function calculate() {
      const weight = Number(document.getElementById('weight').value) || 60;
      const activity = Number(document.getElementById('activity').value) || 1.2;
      const budgetInput = document.getElementById('budget').value;
      const caloriesInput = document.getElementById('calories').value;
      const categorySelect = document.getElementById('category').value;

      const msgBox = document.getElementById('msgBox');
      const recommendScreen = document.getElementById('recommendScreen');
      const resultsArea = document.getElementById('resultsArea');
      const resultsTableBody = document.getElementById('resultsTableBody');

      msgBox.className = 'msg-box';
      msgBox.style.display = 'none';
      recommendScreen.classList.remove('active');
      resultsArea.classList.remove('active');

      const budget = Number(budgetInput);
      const calories = Number(caloriesInput);

      if (!budgetInput || !caloriesInput || isNaN(budget) || isNaN(calories)) {
        showMsg('error', '❌ 請完整輸入有效的預算與熱量數值！');
        return;
      }

      if (budget <= 0 || calories <= 0) {
        showMsg('error', '❌ 預算與熱量必須為大於 0 的正整數！');
        return;
      }

      // 國健署防呆與健康建議
      if (calories < 300) {
        showMsg('warning', '⚠️ 國健署提醒：成年人單餐熱量建議不低於 300 大卡，過度節食可能導致基礎代謝率下降！');
      }

      // 1. 估算國健署建議每日蛋白質需求 (每公斤體重 1.1 克)
      const dailyProteinTargetGram = weight * 1.1; 

      // 2. 條件篩選
      const results = [];
      for (let i = 0; i < FOOD_DATABASE.length; i++) {
        const item = FOOD_DATABASE[i];
        if (item.price <= budget && item.calories <= calories) {
          if (categorySelect === 'ALL' || item.category === categorySelect) {
            results.push(item);
          }
        }
      }

      if (results.length === 0) {
        showMsg('warning', '⚠️ 在您設定的條件下找不到合適的餐點，建議提高預算或放寬熱量限制！');
        return;
      }

      // 3. 隨機推薦餐點與國健署指南換算
      const randomItem = results[Math.floor(Math.random() * results.length)];
      // 國健署定義：1 份豆魚蛋肉類 = 7 公克蛋白質
      const proteinPortion = (randomItem.protein / 7).toFixed(1); 
      const dailyRatio = Math.round((randomItem.protein / dailyProteinTargetGram) * 100);

      document.getElementById('recName').textContent = randomItem.name;
      document.getElementById('recMeta').textContent = `${randomItem.category}類 · ${randomItem.price}元 · ${randomItem.calories} kcal · 蛋白質 ${randomItem.protein}g`;
      document.getElementById('recPortion').textContent = `${proteinPortion} 份`;
      document.getElementById('recRatio').textContent = `約 ${dailyRatio}%`;
      document.getElementById('recHpaTip').textContent = `💡 國健署解析：${randomItem.tip}`;
      
      recommendScreen.classList.add('active');

      // 4. 渲染表格
      document.getElementById('resultsTitle').textContent = `📋 符合條件的餐點 (共 ${results.length} 筆)`;
      resultsTableBody.innerHTML = '';
      
      results.forEach(item => {
        const portions = (item.protein / 7).toFixed(1);
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${item.name}</strong></td>
          <td><span class="tag tag-${item.category}">${item.category}類</span></td>
          <td>${item.price} 元</td>
          <td>${item.calories} kcal</td>
          <td>${item.protein}g (<b>${portions}</b> 份)</td>
        `;
        resultsTableBody.appendChild(tr);
      });

      resultsArea.classList.add('active');
    }

    function showMsg(type, text) {
      const msgBox = document.getElementById('msgBox');
      msgBox.className = `msg-box ${type}`;
      msgBox.textContent = text;
      msgBox.style.display = 'block';
    }

    document.querySelector('#theme').addEventListener('click', event => {
      document.body.classList.toggle('dark');
      const isDark = document.body.classList.contains('dark');
      event.currentTarget.textContent = isDark ? '淺色模式' : '深色模式';
    });
  </script>
</body>
</html>
